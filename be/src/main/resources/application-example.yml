spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lipe_database?serverTimezone=Asia/Seoul
    username: root
    password: YOUR_PASSWORD_HERE
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 테이블 자동 생성
    show-sql: true       # 실행되는 SQL 콘솔 출력
    properties:
      hibernate:
        format_sql: true